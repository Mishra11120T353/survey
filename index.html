<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<style>
    body {
        font-family: 'Times New Roman', Times, serif;
        display: flex;
        justify-content: center;
        align-items: center;
        background:linear-gradient(135deg, #74ebd5, #9face6);
        margin: 0;
        }
        .Form-container {
        background-color: #fff;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 8);
        width: 100%;
        max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
            color: #444;
        }

        input,select, textarea {
            width: 95%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

         input:focus, select:focus, textarea:focus {
             border-color: #6c63ff;
        }

        button {
      width: 100%;
      padding: 12px;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #574bdb;
    }






</style>
<body>
    <div class="Form-container">
        <h1>Survey Form</h1>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder=" Enter your name" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder=" Enter Email" required>
            <br>
            <label for="age">Age:</label>
            <input type="number" id="age" placeholder=" Enter your age" required min="1" max="120">
            <br>
            <p>Gender:</p>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="other">Other</label>
            <input type="radio" id="other" name="gender" value="other">
            <br>
            <label for="role">which option best discribe you?</label>
            <select id="role" required>
                <option value="">Select an option</option>
                <option value="Employed">Employed</option>
                <option value="unemployed">unemployed</option>
                <option value="self-employed">Self-employed</option>
                <option value="student">Student</option>
                <option value="retired">retired</option>
                <option value="other">Other</option>
            </select>
            <br><br>
            <lable>Would you recommend us to a friend?</lable><br>
            <input type="radio" name="recommend" value="yes">Yes
            <input type="radio" name="recommend" value="no">No
            <br><br>
            <label for="feedback">feedback:</label><br>
            <textarea id="feedback" rows="4" placeholder="Enter your feedback here......"></textarea>
            <br>
            <button type="submit">Submit</button>
        </form>
    </div>

    </div>
</body>
</html>
